escenario:'Escolar masculino de 10 años 4 meses, 33 kg (p50), talla 140 cm (p50); sano. 36 h de fiebre 38.8 °C, cefalea, mialgias y dolor en FID con 7 evacuaciones con moco y estrías sanguinolentas. Comió pollo asado insuficientemente cocido hace 3 días. Dolor en FID sin defensa ni rebote. USG: apéndice normal (4.5 mm compresible), engrosamiento inflamatorio de íleon terminal y colon ascendente con adenitis mesentérica reactiva.',
pregunta:'Con cuadro de enterocolitis febril con dolor en FID ("pseudoapendicitis") tras aves mal cocidas, ¿cuál es el agente más probable y el estudio confirmatorio?',
opciones:['Campylobacter jejuni (bacilo gramnegativo curvo microaerófilo "en ala de gaviota"; causa bacteriana líder de GEA asociada a aves mal cocidas que produce ileocolitis terminal simulando apendicitis); confirmar con coprocultivo en medios selectivos microaerófilos (Campy-BAP o Skirrow a 42 °C) o PCR múltiple en heces','Yersinia pestis; hemocultivos y tinción de Wayson','Giardia lamblia; prueba de la cuerda encapsulada','Cryptosporidium parvum; tinción de Kinyoun modificada','Strongyloides stercoralis; método de Baermann en heces'],
justificacion:'Campylobacter jejuni y Yersinia enterocolitica causan ileítis terminal y adenitis mesentérica que pueden confundirse con apendicitis aguda en escolares/adolescentes.',
referencia:'AAP Red Book 2024–2027 (Campylobacter Infections).'},

{id:75,tema:'inf',subtema:'Campylobacter: antibiótico de elección',
escenario:'PCR múltiple en heces confirma Campylobacter jejuni en el escolar de 10 años con enterocolitis (48 h de evolución). Persiste fiebre 38.9 °C, dolor abdominal intenso y evacuaciones sanguinolentas.',
pregunta:'Según AAP 2024, ¿qué efecto tiene el antibiótico temprano en la enteritis por Campylobacter y cuál es de primera línea?',
opciones:['Administrado dentro de los primeros 3 días, acorta la diarrea y elimina la excreción fecal en 2–3 días; primera línea: azitromicina VO 10 mg/kg/día (330 mg, máx 500 mg) una vez al día × 3 días (o eritromicina × 5 días), dado que la resistencia a fluoroquinolonas supera el 30–50%','Los antibióticos están estrictamente contraindicados porque inducen síndrome urémico hemolítico','Ceftriaxona IM dosis única 50 mg/kg (ineficaz frente a Campylobacter)','Vancomicina VO 10 mg/kg cada 6 h × 10 días','Amoxicilina VO 50 mg/kg/día × 7 días'],
justificacion:'Campylobacter es intrínsecamente resistente a muchas cefalosporinas y penicilinas, y presenta altas tasas de resistencia a ciprofloxacino; azitromicina es el agente de elección.',
referencia:'AAP Red Book 2024–2027 (Campylobacter Infections).'},

{id:76,tema:'inf',subtema:'Síndrome de Guillain-Barré post-Campylobacter',
escenario:'El escolar de 10 años se recupera de la enterocolitis por Campylobacter. Dos semanas después: debilidad muscular simétrica progresiva ascendente iniciada en pies y piernas (dificultad para subir escaleras), parestesias distales y arreflexia patelar y aquílea bilateral.',
pregunta:'¿Cuál es esta complicación autoinmune postinfecciosa y su mecanismo inmunopatogénico?',
opciones:['Síndrome de Guillain-Barré (polirradiculoneuropatía inflamatoria aguda) por mimetismo molecular entre lipooligosacáridos de Campylobacter jejuni y gangliósidos periféricos GM1/GD1a; primera línea en pediatría: IGIV 2 g/kg en 2–5 días o plasmaféresis','Miastenia gravis neonatal transitoria; anticuerpos anti-receptor de acetilcolina','Mielitis transversa por invasión bacteriana directa','Poliomielitis paralítica aguda por enterovirus','Distrofia muscular de Duchenne descompensada'],
justificacion:'Campylobacter jejuni es el antecedente infeccioso identificable más común (30–40%) del SGB en niños y adultos.',
referencia:'AAP Red Book 2024–2027 (Campylobacter Infections); van Doorn PA, et al. EAN/PNS Guideline on Guillain-Barré Syndrome, 2023.'},

{id:77,tema:'inf',subtema:'Salmonelosis no tifoídica en <3 meses',
escenario:'Lactante masculino de 2 meses 10 días (10 semanas), 5.4 kg (p50), talla 59 cm (p50); a término, fórmula, tortuga como mascota. 24 h de fiebre 39.0 °C, irritabilidad y 6 evacuaciones mucosanguinolentas verdosas. Febril 38.9 °C, irritable consolable, fontanela normotensa, llenado capilar 2 s, deshidratación leve. Panel molecular en heces: Salmonella enterica serovar Typhimurium.',
pregunta:'En inmunocompetentes >1 año la GEA por Salmonella no tifoídica no se trata, pero ¿por qué la edad <3 meses cambia el riesgo y la conducta según AAP 2024?',
opciones:['Los <3 meses tienen riesgo elevado (5–10%) de bacteriemia secundaria e infecciones focales invasivas graves (meningitis, osteomielitis, artritis séptica) por inmadurez de la inmunidad celular y reticuloendotelial; requieren evaluación completa de sepsis (hemocultivos, urocultivo ± PL) e inicio inmediato de antibiótico IV empírico','Porque en <3 meses Salmonella produce toxina Shiga y SHU','Porque en <3 meses causa intususcepción ileocólica en 80%','Porque los <3 meses no responden a SRO','No cambia en absoluto; alta sin antibióticos ni estudios como en un niño de 5 años'],
justificacion:'Grupos de alto riesgo con indicación de antibiótico en salmonelosis no tifoídica: <3 meses, inmunodeficiencias, drepanocitosis/asplenia, EII, sepsis/bacteriemia documentada.',
referencia:'AAP Red Book 2024–2027 (Salmonella Infections).'},

{id:78,tema:'inf',subtema:'Salmonella: antibiótico IV empírico',
escenario:'Se tomaron hemocultivos, urocultivo y LCR del lactante de 10 semanas con salmonelosis. LCR normal (3 leucocitos/µL, proteínas 38, glucosa 62). Hospitalizado con hidratación; pendiente antibiograma.',
pregunta:'Según AAP 2024, ¿cuál es el esquema antibiótico IV empírico de primera línea para este lactante de 10 semanas con salmonelosis?',
opciones:['Ceftriaxona IV 50–75 mg/kg/día cada 24 h (270–405 mg/día) o cefotaxima IV (ajustando según sensibilidad: 7–10 días si hemocultivos negativos; 14 días si bacteriemia sin meningitis)','Gentamicina IV en monoterapia (ineficaz intracelular frente a Salmonella)','Vancomicina IV 15 mg/kg cada 6 h','Clindamicina IV 10 mg/kg cada 8 h','Cefalexina VO 25 mg/kg/día'],
justificacion:'Salmonella es patógeno intracelular facultativo: aminoglucósidos y cefalosporinas 1.ª/2.ª generación carecen de eficacia in vivo incluso si parecen susceptibles in vitro; las cefalosporinas de 3.ª generación tienen excelente penetración tisular y actividad intracelular.',
referencia:'AAP Red Book 2024–2027 (Salmonella Infections).'},

{id:79,tema:'inf',subtema:'Salmonella: prevención de reptiles',
escenario:'El lactante de 10 semanas con salmonelosis completó 7 días de ceftriaxona, hemocultivos y urocultivo negativos a 72 h, con excelente evolución. Antes del alta, la familia pregunta por la tortuga mascota.',
pregunta:'¿Qué medida educativa de salud pública/prevención secundaria debe indicarse obligatoriamente antes del egreso?',
opciones:['Retirar del hogar o evitar todo contacto de niños <5 años con reptiles y anfibios (tortugas, iguanas, lagartijas, ranas) y aves de corral de traspatio (hasta 90% de los reptiles son portadores intestinales asintomáticos de Salmonella); reforzar lavado estricto de manos y preparación higiénica de biberones','Antibióticos profilácticos mensuales al lactante mientras conserve la tortuga','Coprocultivos semanales 6 meses y aislamiento hasta 3 cultivos negativos','Vacuna inmediata contra Salmonella Typhi a los 2 meses','Hervir la fórmula en polvo con antibióticos antes de cada toma'],
justificacion:'AAP y CDC recomiendan enfáticamente no tener reptiles ni anfibios en hogares con niños <5 años por riesgo recurrente de salmonelosis invasiva.',
referencia:'AAP Red Book 2024–2027 (Salmonella Infections).'},

{id:80,tema:'gas',subtema:'C. difficile: diagnóstico en niños ≥2 años',
escenario:'Escolar femenino de 7 años 5 meses, 24 kg (p50), talla 123 cm (p50); sin antecedentes crónicos. Hace 10 días: hospitalización 4 días por celulitis facial tratada con clindamicina IV y luego VO ambulatoria. Ahora 48 h de fiebre 38.4 °C, dolor cólico difuso y 8 evacuaciones líquidas verdosas fétidas con moco. Dolor abdominal difuso moderado sin irritación peritoneal; deshidratación leve. Leucocitos 14,800 (74% neutrófilos), albúmina 3.8, Cr 0.5.',
pregunta:'Con exposición reciente a clindamicina + hospitalización en niña >2 años, ¿cuál es la sospecha diagnóstica y el protocolo según AAP 2024 e IDSA/SHEA?',
opciones:['Infección por C. difficile (ICD) no grave (las pruebas solo en ≥2 años con diarrea clínicamente significativa, porque <1–2 años tienen alta colonización asintomática); confirmar con algoritmo de múltiples pasos: GDH + inmunoensayo para toxinas A/B (o NAAT) en heces líquidas','Intolerancia alimentaria simple; no estudiar y dar loperamida','Disentería amebiana aguda; serología IgG anti-Entamoeba','Enfermedad celíaca de inicio súbito; biopsia duodenal urgente','Colitis ulcerosa crónica; mesalazina VO inmediata'],
justificacion:'La clindamicina, las cefalosporinas de 3.ª generación y las fluoroquinolonas son los principales disruptores de la microbiota que permiten la proliferación de C. difficile productor de toxinas TcdA/TcdB.',
referencia:'AAP Red Book 2024–2027 (Clostridioides difficile); Johnson S, et al. IDSA/SHEA 2021 Focused Update. Clin Infect Dis 2021;73:e1029-e1044.'},

{id:81,tema:'gas',subtema:'C. difficile: tratamiento de primera línea',
escenario:'La paciente de 7 años con ICD (GDH y toxinas A/B positivas) suspende clindamicina oral e inicia SRO. Primer episodio no grave, 24 kg.',
pregunta:'Según IDSA/SHEA 2021 y AAP 2024, ¿cuál es el tratamiento oral de primera elección en este primer episodio no grave?',
opciones:['Vancomicina VO 10 mg/kg/dosis (240 mg, máx 125 mg/dosis en esquemas estándar) cada 6 h × 10 días, o fidaxomicina VO (suspensión/tabletas) × 10 días, preferida sobre metronidazol por mayor curación sostenida y menor recurrencia','Metronidazol VO 30 mg/kg/día como primera línea superior en todos los casos','Vancomicina IV 15 mg/kg cada 6 h × 10 días (ineficaz por no alcanzar concentraciones intraluminales)','Ciprofloxacino VO 15 mg/kg cada 12 h × 7 días','Rifaximina VO 3 días como monoterapia inicial'],
justificacion:'IDSA/SHEA y AAP relegaron el metronidazol a alternativa secundaria (solo si no hay vancomicina o fidaxomicina). Vancomicina IV no sirve porque no se excreta a la luz colónica.',
referencia:'Johnson S, et al. IDSA/SHEA 2021 Focused Update. Clin Infect Dis 2021;73:e1029-e1044; AAP Red Book 2024–2027.'},

{id:82,tema:'gas',subtema:'C. difficile: control de infecciones',
escenario:'La paciente de 7 años completó 10 días de vancomicina oral con resolución completa de fiebre y normalización de evacuaciones.',
pregunta:'¿Qué medida de control de infecciones/precaución domiciliaria es esencial considerando la resistencia intrínseca de las esporas de C. difficile?',
opciones:['Higiene de manos mecánica con agua y jabón (el gel alcohólico no inactiva las esporas), limpieza ambiental con esporicidas (hipoclorito de sodio), aislamiento de contacto durante el episodio diarreico, y NO realizar pruebas repetidas de "cura" en heces tras la resolución clínica (la excreción asintomática puede persistir semanas sin requerir retratamiento)','Higiene de manos exclusivamente con gel hidroalcohólico al 70% + prueba de cura en heces al terminar vancomicina','Vancomicina oral profiláctica de por vida con cualquier fármaco','Inmunoglobulina IV mensual × 6 meses','Loperamida ante cualquier evacuación blanda por 1 año'],
justificacion:'Las esporas de C. difficile resisten el alcohol y persisten meses en superficies; solo el arrastre mecánico con agua y jabón y los esporicidas clorados las eliminan eficazmente.',
referencia:'AAP Red Book 2024–2027 (Clostridioides difficile).'}, {id:83,tema:'neo',subtema:'Enfermedad hemorrágica tardía por déficit de vitamina K',
escenario:'Lactante masculino de 6 semanas (42 días), 4.6 kg (p50), talla 55 cm (p50); parto domiciliario sin profilaxis neonatal, seno materno exclusivo. 12 h de palidez progresiva, rechazo al seno, vómitos en proyectil, irritabilidad → letargia y sangrado persistente en sitio de punción. Pálido, somnoliento, fontanela abombada y tensa, anisocoria leve (pupila derecha 4 mm poco reactiva, izquierda 2.5 mm), equimosis en tronco. Hb 7.2, leucos 11,400, plaquetas 345,000, TP >90 s (INR >8.0), TTPa >120 s, fibrinógeno 260.',
pregunta:'Con parto domiciliario sin profilaxis, lactancia materna, coagulopatía grave con plaquetas/fibrinógeno normales e HIC aguda, ¿cuál es el diagnóstico y el tratamiento hemostático inmediato?',
opciones:['Enfermedad hemorrágica tardía por déficit de vitamina K (VKDB tardía) con hemorragia intracraneal; vitamina K1 IV lenta 1–2 mg + complejo protrombínico de 4 factores (25–50 UI/kg) o PFC (15–20 mL/kg) + concentrado eritrocitario + TC craneal urgente','CID por sepsis tardía; heparina no fraccionada + concentrado plaquetario','Hemofilia A congénita; factor VIII recombinante 50 UI/kg','Trombocitopenia aloinmune neonatal; IGIV 2 g/kg','Enfermedad de von Willebrand tipo 3; desmopresina IV'],
justificacion:'La VKDB tardía ocurre entre las 2 y 12 semanas (pico 3–8) casi exclusivamente en lactantes al pecho sin vitamina K IM al nacer, y debuta con hemorragia intracraneal en >50–60% de los casos. La vitamina K1 restaura la síntesis de factores II, VII, IX, X en 4–6 h; el complejo protrombínico o PFC repone factores de inmediato.',
referencia:'Hand I, Noble L, Abrams SA; AAP Committee on Fetus and Newborn. Vitamin K and the Newborn Infant. Pediatrics 2022;149:e2021056036.'},

{id:84,tema:'neo',subtema:'VKDB tardía: descartar causa secundaria',
escenario:'TC de cráneo: hematoma subdural agudo frontoparietal derecho con desviación de línea media 6 mm; evacuación neuroquirúrgica exitosa tras corregir INR a 1.1. A las 6 h de vitamina K1 IV los tiempos de coagulación se normalizan por completo.',
pregunta:'¿Qué estudio adicional debe realizarse en todo lactante con VKDB tardía para descartar una causa secundaria de malabsorción lipídica antes del egreso?',
opciones:['Perfil hepático completo con bilirrubina directa/conjugada, GGT y ácidos biliares (± cribado de fibrosis quística si hay datos digestivos), para descartar colestasis neonatal oculta (atresia de vías biliares, déficit de alfa-1-antitripsina) que impida la absorción de vitaminas liposolubles','Aspirado de médula ósea y cariotipo','Electroforesis de hemoglobina y fragilidad osmótica','Biopsia muscular de cuádriceps','Angiorresonancia renal bilateral'],
justificacion:'La VKDB tardía puede ser la primera manifestación hemorrágica de una colestasis hepatobiliar subclínica, incluso en niños con profilaxis oral o incompleta.',
referencia:'Hand I, Noble L, Abrams SA; AAP Committee on Fetus and Newborn. Pediatrics 2022;149:e2021056036.'},

{id:85,tema:'neo',subtema:'Profilaxis con vitamina K al nacer',
escenario:'El perfil hepático del lactante con VKDB tardía descarta colestasis (BD 0.2 mg/dL). Se confirma VKDB tardía idiopática por omisión de profilaxis neonatal. Los padres preguntan cómo se previene.',
pregunta:'Según la declaración AAP 2022, ¿cuál es el régimen profiláctico de oro para prevenir la forma clásica y tardía de VKDB en todos los recién nacidos?',
opciones:['Dosis única IM de vitamina K1 (fitomenadiona) 1.0 mg dentro de las primeras 6 h para todos los RN >1,500 g (0.3–0.5 mg/kg IM en pretérmino ≤1,500 g), ya que los esquemas orales son inferiores para prevenir VKDB tardía','2 mg de vitamina K1 VO al nacimiento únicamente','1 mg VO al nacer + 1 mg a los 7 días + 1 mg a las 4 semanas','Suplementación materna con 5 mg/día de vitamina K sin tratar al neonato','No administrar profilaxis a RN a término sanos salvo que presenten sangrado'],
justificacion:'El depósito muscular de fitomenadiona actúa como liberación sostenida durante semanas, eliminando prácticamente el riesgo de VKDB tardía. Los esquemas orales no son equivalentes.',
referencia:'Hand I, Noble L, Abrams SA; AAP Committee on Fetus and Newborn. Pediatrics 2022;149:e2021056036.'},

{id:86,tema:'hem',subtema:'PTI: indicación de aspirado medular',
escenario:'Preescolar femenino de 4 años 2 meses, 16 kg (p50), talla 102 cm (p50); sana, vacunas completas. 24 h de petequias puntiformes generalizadas, equimosis en extremidades/tronco y epistaxis anterior leve autolimitada. IRA viral 12 días antes. Afebril, activa, sin dolor óseo, sin adenopatías significativas ni hepatoesplenomegalia. Hb 12.2, VCM 80, leucos 8,100 con fórmula normal, plaquetas 8,000; frotis con plaquetas grandes aisladas, series roja y blanca normales sin blastos.',
pregunta:'Ante una PTI de reciente diagnóstico típica en preescolar previamente sana sin síntomas constitucionales ni visceromegalias, ¿cuál es la conducta correcta respecto al aspirado de médula ósea?',
opciones:['No realizar aspirado de médula ósea en presentación típica de PTI (trombocitopenia aislada con Hb, leucos y frotis normales, sin fiebre prolongada, dolor óseo, pérdida de peso ni hepatoesplenomegalia); reservar el estudio medular para cuadros atípicos o previo a corticoterapia si hay dudas diagnósticas','Aspirado y biopsia de médula ósea obligatorios en todos los niños antes de cualquier decisión','Biopsia ganglionar y TC corporal total','Tiempo de sangrado de Ivy y biopsia de piel','Diferir la biometría de control 6 meses'],
justificacion:'Guías ASH y revisiones hematológicas pediátricas confirman que el riesgo de pasar por alto una leucemia aguda en trombocitopenia estrictamente aislada con frotis normal es <0.1%.',
referencia:'Grace RF, Lambert MP. An update on pediatric ITP. Blood 2022;140:542-555; Consolini R, et al. AIEOP guidelines for pediatric ITP, 2021.'},

{id:87,tema:'hem',subtema:'PTI con púrpura húmeda: tratamiento de primera línea',
escenario:'La niña de 4 años con PTI (plaquetas 8,000) presenta epistaxis anterior persistente y dos vesículas hemorrágicas en mucosa yugal (púrpura húmeda / sangrado mucoso Grado 3 de Buchanan), con Hb 11.9 y estabilidad hemodinámica.',
pregunta:'Con plaquetas de 8,000/µL y sangrado mucoso activo (púrpura húmeda), ¿cuál es el tratamiento de primera línea y qué intervención debe evitarse salvo hemorragia potencialmente letal?',
opciones:['IGIV en dosis única de 0.8–1.0 g/kg (12.8–16 g) (eleva plaquetas en 24–48 h al bloquear receptores Fcγ esplénicos) o ciclo corto de corticoides (prednisona 2–4 mg/kg/día por 4–7 días) + ácido tranexámico, evitando transfusión de plaquetas (los autoanticuerpos destruyen rápidamente las plaquetas transfundidas)','Transfusión inmediata de 2 unidades de concentrado plaquetario como único tratamiento','Esplenectomía laparoscópica de urgencia','Rituximab IV semanal × 4 semanas como primera línea','Eltrombopag + micofenolato desde el primer día'],
justificacion:'En niños sin sangrado o solo petequias/equimosis se prefiere observación expectante; la púrpura húmeda indica tratamiento de primera línea. La transfusión de plaquetas se reserva para hemorragia que amenaza la vida.',
referencia:'Grace RF, Lambert MP. An update on pediatric ITP. Blood 2022;140:542-555.'},

{id:88,tema:'hem',subtema:'PTI: pronóstico y medidas de seguridad',
escenario:'La paciente de 4 años recibió IGIV 1 g/kg; cesa el sangrado mucoso y a las 48 h las plaquetas ascienden a 78,000/µL. Se prepara egreso domiciliario.',
pregunta:'¿Cuál es el pronóstico natural de la PTI aguda infantil y qué medidas de seguridad indicar a los padres durante el seguimiento?',
opciones:['70–80% presentan remisión espontánea completa en 6–12 meses; evitar AAS y AINEs, restringir deportes de contacto/alto impacto mientras plaquetas <30,000–50,000/µL y acudir a urgencias ante cefalea intensa, alteración neurológica o sangrado mucoso abundante','90% evoluciona a trombocitopenia crónica refractaria que requiere esplenectomía antes de los 6 meses','Prednisona oral continua 12 meses aunque las plaquetas se normalicen','Contraindicar todas las vacunas del esquema de por vida','AAS a dosis bajas para prevenir trombosis paradójica'],
justificacion:'A diferencia del adulto, la PTI pediátrica es mayoritariamente aguda y autolimitada, con riesgo de hemorragia intracraneal <0.5%.',
referencia:'Grace RF, Lambert MP. An update on pediatric ITP. Blood 2022;140:542-555.'},

{id:89,tema:'nef',subtema:'Vasculitis por IgA: diagnóstico y estudios iniciales',
escenario:'Escolar masculino de 6 años 4 meses, 21 kg (p50), talla 117 cm (p50); sano. 48 h de púrpura palpable no desaparece a digitopresión, simétrica en glúteos y caras extensoras de miembros inferiores, con dolor e inflamación periarticular en ambos tobillos y rodillas (impide caminar) y dolor abdominal cólico difuso. FC 104, FR 22, TA 102/64, T 37.3 °C. Hb 12.6, leucos 10,800, plaquetas 365,000, coagulación normal.',
pregunta:'Con criterios EULAR/PRINTO/PRES (púrpura palpable no trombocitopénica + artralgias/artritis + dolor abdominal), ¿cuál es el diagnóstico y los estudios iniciales obligatorios?',
opciones:['Vasculitis por IgA (antes Púrpura de Henoch-Schönlein), vasculitis leucocitoclástica de pequeños vasos mediada por IgA1; examen general de orina (tira reactiva y sedimento), relación proteína/creatinina aislada, TA y química con creatinina para evaluar compromiso renal inicial','Meningococcemia fulminante; ceftriaxona IV + punción lumbar inmediata','Trombocitopenia inmune primaria; anticuerpos antiplaquetarios','Púrpura trombocitopénica trombótica; actividad de ADAMTS13 urgente','Lupus eritematoso sistémico; biopsia renal percutánea inmediata en todos los casos'],
justificacion:'La cifra normal o elevada de plaquetas distingue de inmediato a la vasculitis por IgA de las púrpuras trombocitopénicas. El pronóstico a largo plazo depende casi exclusivamente de la afectación renal (nefritis por IgA).',
referencia:'KDIGO 2021 Clinical Practice Guideline for the Management of Glomerular Diseases. Kidney Int 2021;100:S1-S276.'},

{id:90,tema:'nef',subtema:'Vasculitis IgA: dolor abdominal y corticoides',
escenario:'La vasculitis por IgA del escolar de 6 años tiene EGO inicial normal (sin hematuria/proteinuria) y creatinina 0.45. Al tercer día: dolor abdominal cólico intenso que limita la ingesta, sangre oculta en heces positiva; USG descarta invaginación intestinal.',
pregunta:'Según KDIGO 2021/SHARE, ¿cuál es el tratamiento del dolor abdominal intenso sin invaginación y qué efecto tienen los corticoides sobre la historia natural renal?',
opciones:['Ciclo corto de corticoides sistémicos (prednisona 1–2 mg/kg/día = 21–42 mg/día por 1–2 semanas con descenso gradual): acortan intensidad y duración del dolor abdominal/articular grave, pero NO previenen el desarrollo posterior de nefritis por IgA (nunca prescribir profiláctico para evitar daño renal)','Ibuprofeno 10 mg/kg cada 6 h como analgésico principal','Ciclofosfamida IV inmediata','Laparotomía exploradora diagnóstica','IGIV 2 g/kg'],
justificacion:'Ensayos aleatorizados grandes y KDIGO 2021 confirman que la prednisona temprana alivia síntomas GI y articulares graves pero no modifica la incidencia de nefropatía a 12 meses.',
referencia:'KDIGO 2021 Clinical Practice Guideline for the Management of Glomerular Diseases. Kidney Int 2021;100:S1-S276.'},

{id:91,tema:'nef',subtema:'Vasculitis IgA: seguimiento renal obligatorio',
escenario:'El dolor abdominal y la púrpura del escolar de 6 años remiten completamente en 10 días; se suspende prednisona. Los padres preguntan si ya es alta definitiva.',
pregunta:'Considerando que 85–90% de las nefritis por vasculitis IgA se manifiestan semanas después del exantema, ¿cuál es el protocolo de seguimiento renal obligatorio?',
opciones:['Monitoreo periódico de EGO (tira/sedimento) y TA durante al menos 6–12 meses (semanal/quincenal el primer mes y luego mensual), refiriendo a nefrología pediátrica si aparece proteinuria persistente (relación proteína/creatinina >0.2 mg/mg), HTA o deterioro del filtrado glomerular','Alta definitiva sin análisis de orina posteriores','Biopsia renal protocolaria a los 3 meses aunque el EGO sea normal','Enalapril profiláctico 2 años en todos los pacientes con orina normal','USG Doppler renal mensual por 1 año'],
justificacion:'El seguimiento urinario estructurado 6–12 meses detecta oportunamente la nefritis por IgA antes de progresar a ERC.',
referencia:'KDIGO 2021 Clinical Practice Guideline for the Management of Glomerular Diseases. Kidney Int 2021;100:S1-S276.'},

{id:92,tema:'hem',subtema:'Hemofilia A: clasificación y diagnóstico',
escenario:'Lactante masculino de 11 meses, 9.5 kg (p50), talla 75 cm (p50). Tío materno falleció en infancia por hemorragia grave tras extracción dental. Caída leve al iniciar deambulación: hemartrosis aguda de rodilla derecha (aumento de volumen, calor, limitación a la flexión) + equimosis en glúteos y muslos. Hb 11.4, plaquetas 310,000, TP 12.1 (INR 1.0), TTPa 86 s (testigo 30) que corrige 1:1 con plasma, FvW normal.',
pregunta:'Con herencia recesiva ligada al X, hemartrosis aguda tras trauma mínimo y TTPa aislado prolongado que corrige con plasma, ¿cuál es el estudio confirmatorio y la clasificación de gravedad por nivel residual del factor?',
opciones:['Cuantificación de actividad coagulante de FVIII (FVIII:C) y FIX (para diferenciar hemofilia A de B, indistinguibles clínicamente): actividad <1% = grave, 1–5% = moderada, >5 a <40% = leve','Tiempo de trombina y niveles de factor XIII; <10% = grave','Agregometría plaquetaria con ristocetina; define tromboastenia de Glanzmann','Dosificación de factor VII recombinante; <5% = enfermedad de Christmas','Biopsia sinovial de rodilla derecha'],
justificacion:'Hemofilia A (déficit de FVIII, 80–85%) y B (FIX) presentan idéntica clínica y prolongación aislada de vía intrínseca. En hemofilia grave los sangrados comienzan típicamente a los 9–12 meses al gatear/caminar.',
referencia:'Srivastava A, et al. WFH Guidelines for the Management of Hemophilia, 3rd edition. Haemophilia 2020;26(Suppl 6):1-158.'},

{id:93,tema:'hem',subtema:'Hemofilia A: tratamiento de hemartrosis aguda',
escenario:'FVIII:C <0.5% (hemofilia A grave), FIX normal 98%. El lactante de 9.5 kg persiste con dolor intenso e inflamación progresiva en rodilla derecha.',
pregunta:'Según WFH 3.ª edición, ¿cuál es el tratamiento agudo inmediato de elección de la hemartrosis?',
opciones:['Concentrado de FVIII recombinante IV 25–40 UI/kg (240–380 UI) para alcanzar actividad hemostática pico 50–80% (1 UI/kg FVIII eleva actividad ~2%) + RICE (reposo, frío, compresión suave, elevación) + paracetamol (evitando AINEs y punciones IM)','Artrocentesis evacuadora inmediata sin factor VIII','Desmopresina IV (ineficaz en hemofilia A grave) + ketorolaco IM','AAS oral para reducir inflamación sinovial','Concentrado plaquetario + crioprecipitados como primera opción estándar'],
justificacion:'Principio WFH: "tratar primero, investigar después" ante sospecha de sangrado articular o craneal, para evitar sinovitis crónica por hemosiderina y artropatía hemofílica irreversible.',
referencia:'Srivastava A, et al. WFH Guidelines for the Management of Hemophilia, 3rd edition. Haemophilia 2020;26(Suppl 6):1-158.'},

{id:94,tema:'hem',subtema:'Hemofilia A: profilaxis primaria',
escenario:'La hemartrosis del lactante de 11 meses resolvió con factor VIII. Es su primera hemartrosis; debe establecerse el plan preventivo a largo plazo.',
pregunta:'Según WFH 3.ª edición, ¿cuál es el estándar de oro para prevenir artropatía hemofílica en niños pequeños con hemofilia A grave?',
opciones:['Profilaxis primaria continua temprana (antes de 2–3 años, tras la primera hemartrosis o incluso antes de cualquier sangrado) con infusiones regulares de FVIII estándar/extendido o con emicizumab SC (anticuerpo monoclonal biespecífico que mimetiza la función cofactor del FVIII uniendo FIXa y FX, eficaz en pacientes con y sin inhibidores)','Tratar solo a demanda cuando haya dolor o inflamación','Inmovilizar rodillas con férulas rígidas durante la infancia','Vitamina K oral diaria de por vida','Sinovectomía quirúrgica profiláctica de tobillos y rodillas al año'],
justificacion:'La profilaxis primaria temprana convierte fenotípicamente una hemofilia grave en leve y preserva articulaciones sanas hacia la vida adulta. El emicizumab ha transformado el manejo en lactantes al evitar accesos venosos centrales.',
referencia:'Srivastava A, et al. WFH Guidelines for the Management of Hemophilia, 3rd edition. Haemophilia 2020;26(Suppl 6):1-158.'},

{id:95,tema:'nlg',subtema:'Convulsión febril: manejo domiciliario agudo',
escenario:'Lactante de 18 meses (11.4 kg) con crisis febril simple (3 min, generalizada, única en 24 h, con faringitis viral y exantema súbito). Los padres quedaron muy asustados y preguntan qué hacer si vuelve a ocurrir.',
pregunta:'Según NICE NG217 (2022/2023), ¿qué instrucciones de manejo agudo domiciliario y qué fármaco de rescate son correctos?',
opciones:['Posición lateral de seguridad sobre superficie blanda, no introducir objetos en la boca, cronometrar la duración y medicación de rescate solo si la crisis dura >5 min: midazolam bucal/intranasal 0.2 mg/kg (2.3 mg o 2.5 mg estándar 1–4 años) o diazepam rectal 0.5 mg/kg (5 mg), llamando a emergencias si no cede tras 5 min de la dosis','Sujetar con fuerza las extremidades, introducir cuchara en la boca y dar agua fría','Paracetamol oral durante la fase tónico-clónica','Fenobarbital oral en cuanto inicie la convulsión','Sumergir al niño en bañera con agua helada'],
justificacion:'NICE NG217 establece el umbral de 5 min para intervenir farmacológicamente en la comunidad; el midazolam bucal/intranasal es de primera elección por rapidez de absorción y facilidad de aplicación frente a la vía rectal.',
referencia:'NICE NG217. Epilepsies in children, young people and adults, 2022 (actualizado 2023).'},

{id:96,tema:'nlg',subtema:'Convulsión febril: no profilaxis, pronóstico',
escenario:'La madre del lactante de 18 meses con crisis febril simple solicita medicamento diario o diazepam cada vez que tenga fiebre para "evitar que vuelva a convulsionar".',
pregunta:'¿Cuál es la recomendación basada en evidencia sobre profilaxis anticonvulsiva (continua o intermitente) y el riesgo de epilepsia futura tras crisis febril simple?',
opciones:['Desaconsejar tanto la terapia antiepiléptica continua (fenobarbital, valproato) como la profilaxis intermitente con benzodiacepinas, ya que sus efectos adversos superan el riesgo de un trastorno benigno; explicar que la recurrencia es del 30–35% y el riesgo de epilepsia futura apenas 1–2% (similar a la población general)','Ácido valproico oral diario 2 años hasta los 4 años','Fenobarbital oral diario 12 meses','Diazepam oral cada 8 h siempre que T >38.0 °C','Antipiréticos agresivos cada 3 h porque previenen eficazmente la recurrencia'],
justificacion:'Múltiples ECA han demostrado que los antipiréticos no previenen la recurrencia de crisis febriles, y los efectos adversos de antiepilépticos superan el riesgo de un trastorno benigno.',
referencia:'Corsello A, et al. Febrile Seizures: A Systematic Review of Different Guidelines. Ital J Pediatr 2022;48:115.'},

{id:97,tema:'nlg',subtema:'Estado epiléptico: benzodiacepina no IV',
escenario:'Preescolar femenino de 5 años 2 meses, 18 kg (p50), talla 110 cm (p50). Epilepsia focal estructural en tratamiento con oxcarbazepina (suspendida accidentalmente hace 4 días). Crisis tónico-clónica generalizada continua de 12 min sin recuperar conciencia (estado epiléptico convulsivo establecido). Vía aérea lateral, O₂, monitorización (FC 154, FR 26 irregular, SatO₂ 92%, TA 108/68), glucemia 94. Sin acceso venoso.',
pregunta:'En fase inicial (min 5–20) sin acceso IV, ¿cuál es el tratamiento farmacológico de primera línea según NICE NG217?',
opciones:['Benzodiacepina de acción rápida por vía NO intravenosa de inmediato: midazolam IM 0.2 mg/kg (3.6 mg, máx 10 mg) — o midazolam bucal/intranasal 0.2–0.3 mg/kg, o diazepam rectal 0.5 mg/kg — y pasar a lorazepam IV 0.1 mg/kg (1.8 mg, máx 4 mg) en cuanto se obtenga vía, si persiste >5 min (máx 2 dosis totales de benzodiacepina)','Esperar 15 min hasta canalizar vía venosa central antes de cualquier fármaco','Fenitoína IM 20 mg/kg en glúteo','Levetiracetam por SNG 20 mg/kg','Lidocaína IV bolo 2 mg/kg'],
justificacion:'RAMPART demostró que midazolam IM es al menos tan eficaz y más rápido de administrar que lorazepam IV cuando no hay vía canalizada. Limitar a 2 dosis previene depresión respiratoria y internalización de receptores GABA-A.',
referencia:'NICE NG217. Epilepsies in children, young people and adults, 2022 (actualizado 2023); Chamberlain JM, et al. Lancet 2020.'},

{id:98,tema:'nlg',subtema:'Estado epiléptico: segunda línea (ESETT)',
escenario:'La niña de 18 kg recibió midazolam IM y luego lorazepam 1.8 mg IV tras canalizar vena; al minuto 22 persiste con actividad tónico-clónica generalizada (estado epiléptico resistente a benzodiacepinas).',
pregunta:'Según el ensayo ESETT (Lancet 2020), ¿cuál es el fármaco y dosis exacta de segunda línea indicado para esta niña de 18 kg?',
opciones:['Levetiracetam IV en carga única de 60 mg/kg (1,080 mg, máx 4,500 mg) en 10 min (o fosfenitoína 20 mg PE/kg o valproato 40 mg/kg; ESETT demostró eficacia equivalente ~47–52% entre los tres, siendo levetiracetam preferido por perfil cardiovascular seguro y sin hepatotoxicidad/arritmias)','Fenitoína IV bolo rápido 5 mg/kg en 30 s','Tercera y cuarta dosis de lorazepam IV antes de segunda línea','Topiramato oral por SNG 5 mg/kg','Gabapentina IV 15 mg/kg'],
justificacion:'ESETT (Lancet 2020) comparó dosis óptimas basadas en peso de levetiracetam (60 mg/kg), fosfenitoína (20 mg PE/kg) y valproato (40 mg/kg) en ≥2 años: eficacia equivalente (~50% cese clínico a 60 min) sin diferencias en eventos adversos graves.',
referencia:'Chamberlain JM, Kapur J, Shinnar S, et al. ESETT trial. Lancet 2020;395:1217-1224.'},

{id:99,tema:'nlg',subtema:'Estado epiléptico refractario',
escenario:'A pesar de levetiracetam 60 mg/kg, al minuto 42 persisten sacudidas clónicas sutiles faciales y deterioro respiratorio (estado epiléptico refractario).',
pregunta:'¿Cuál es el manejo en esta tercera fase (refractario, >30–40 min sin respuesta a benzodiacepina + segunda línea)?',
opciones:['Ingreso inmediato a UCIP, intubación endotraqueal con soporte ventilatorio, monitorización con EEG continuo (para descartar estado epiléptico no convulsivo sutil tras cese motor) e inicio de infusión continua de anestésicos (midazolam, ketamina o pentobarbital/tiopental) hasta supresión de crisis electrográficas o patrón brote-supresión','Observación 6 h en sala general esperando cese espontáneo','Glucosa hipertónica 50% y alta si cede el movimiento visible','Cambiar a carbamazepina oral por SNG','Punción lumbar evacuadora sin asegurar vía aérea'],
justificacion:'En el estado refractario existe alta incidencia de disociación electromecánica (persisten descargas cerebrales dañinas pese a cese motor); la cEEG en UCIP es indispensable.',
referencia:'NICE NG217. Epilepsies in children, young people and adults, 2022 (actualizado 2023).'},

{id:100,tema:'neo',subtema:'Crisis neonatal: clasificación ILAE 2021',
escenario:'RN masculino a término de 39 SDG, 3.3 kg (p50), 50 cm (p50); DPPNI con asfixia perinatal grave (Apgar 2/4/5, pH cordón 6.94, déficit de base −18). En hipotermia terapéutica a 33.5 °C. A las 14 h de vida: 90 s de sacudidas clónicas rítmicas focales de miembro superior derecho y desviación conjugada de mirada a la derecha con desaturación. Glucemia 74, calcio iónico 1.18 mmol/L, magnesio 1.9 (normales).',
pregunta:'Según el documento de posición ILAE Neonatal 2021, ¿qué característica fisiopatológica define las crisis neonatales y cuál es el método diagnóstico estándar de oro?',
opciones:['La mayoría son agudas provocadas (encefalopatía hipóxico-isquémica es la causa #1) con marcada "disociación electroclínica" (hasta 80% son exclusivamente electrográficas sin correlato motor visible); el estándar de oro es el video-EEG continuo (cEEG) (o aEEG como tamizaje al pie de cama)','Todos los movimientos paroxísticos neonatales son epilépticos y deben tratarse sin confirmación eléctrica','TC de cráneo de urgencia como único estudio confirmatorio','Niveles séricos de amonio y lactato para confirmar actividad ictal','Punción lumbar antes de evaluar el trazado electroencefalográfico'],
justificacion:'La clasificación ILAE Neonatal 2021 destaca que los neonatos no presentan crisis generalizadas primarias por mielinización incompleta y conectoma inmaduro, sino crisis de inicio focal o exclusivamente electrográficas.',
referencia:'Pressler RM, Cilio MR, Mizrahi EM, et al. ILAE classification of seizures in the neonate. Epilepsia 2021;62:615-628.'},

{id:101,tema:'neo',subtema:'Crisis neonatal: fenobarbital primera línea',
escenario:'El video-EEG continuo del neonato de 3.3 kg confirma descargas rítmicas focales frontocentrales izquierdas evolutivas con carga ictal de 14 min en la última hora.',
pregunta:'Según guías OMS y consenso internacional de neurología neonatal, ¿cuál es el fármaco y dosis de carga inicial de primera línea?',
opciones:['Fenobarbital IV en carga inicial de 20 mg/kg (66 mg) lenta en 15–20 min, con bolos adicionales de 10 mg/kg hasta acumulado total 40 mg/kg si persisten crisis electrográficas, antes de escalar a segunda línea (levetiracetam o fenitoína/fosfenitoína)','Lorazepam IV 0.5 mg/kg en bolo único','Carbamazepina oral por SOG 15 mg/kg','Ácido valproico IV 40 mg/kg','Topiramato oral 10 mg/kg/día'],
justificacion:'NEOLEV2 y guías actualizadas confirman que fenobarbital es significativamente más eficaz que levetiracetam como primera línea en neonatos (~80% vs ~28% de erradicación de crisis electrográficas a las 24 h).',
referencia:'Sharpe C, Reiner GE, Davis SL, et al. NEOLEV2. Pediatrics 2020;145:e20193182; WHO Newborn Seizure Guidelines, 2023.'},

{id:102,tema:'neo',subtema:'Crisis neonatal aguda: suspensión precoz de fenobarbital',
escenario:'Tras carga de fenobarbital cesan por completo crisis clínicas y electrográficas. El neonato completa 72 h de hipotermia terapéutica y recalentamiento sin recurrencia por >5 días, con succión vigorosa.',
pregunta:'Según el Neonatal Seizure Registry (JAMA Neurol 2021), ¿cuál es la conducta respecto a la continuación o suspensión del fenobarbital antes del alta en crisis agudas provocadas resueltas (EHI)?',
opciones:['Suspender fenobarbital antes del alta una vez resueltas las crisis agudas (tras ≥48–72 h libres de crisis electrográficas): mantenerlo meses no previene epilepsia postneonatal y se asocia con apoptosis neuronal y peores desenlaces del neurodesarrollo','Mantener fenobarbital oral obligatorio hasta los 3 años en todos los neonatos','Sustituir por ácido valproico oral 24 meses al egreso','RM cerebral mensual durante el primer año antes de suspender','Continuar fenobarbital solo si el reflejo de Moro está presente al alta'],
justificacion:'El Neonatal Seizure Registry (Glass et al., JAMA Neurol 2021) demostró que suspender la medicación anticrisis antes del alta en crisis neonatales agudas provocadas es seguro y no incrementa el riesgo de epilepsia a los 24 meses.',
referencia:'Glass HC, Soul JS, Chang T, et al. Safety of Early Discontinuation of Antiseizure Medication After Acute Symptomatic Neonatal Seizures. JAMA Neurol 2021;78:817-825.'},

{id:103,tema:'nef',subtema:'LRA KDIGO + hiperK grave: calcio',
escenario:'Preescolar masculino de 4 años 3 meses, 16 kg (p50), talla 103 cm (p50); sano. Creatinina basal hace 2 meses: 0.35 mg/dL. 4 días de GEA con vómitos + múltiples dosis altas de ibuprofeno VO sin reposición. 18 h de oliguria (0.18 mL/kg/h), letargia y debilidad muscular. Cr 1.48 mg/dL (>4× basal), BUN 64, Na 132, K 7.2, Cl 96, HCO₃ 13, Ca 8.6. ECG: ondas T picudas simétricas de base estrecha, PR prolongado y QRS ensanchándose.',
pregunta:'Según KDIGO pediátrico, ¿cómo se estadifica la LRA y cuál es la primera medida farmacológica inmediata ante hiperpotasemia grave con repercusión electrocardiográfica?',
opciones:['LRA estadio 3 (Cr ≥3.0× basal [1.48/0.35 = 4.2×] y/o oliguria <0.3 mL/kg/h ≥24 h); gluconato de calcio al 10% IV a 0.5–1.0 mL/kg (50–100 mg/kg = 8–16 mL) lento en 5–10 min bajo monitorización ECG continua para antagonizar el efecto despolarizante del K sobre la membrana miocárdica y prevenir FV/asistolia','LRA estadio 1; poliestireno sulfonato cálcico VO como primera medida','LRA estadio 2; furosemida IV en bolo y observar 4 h','LRA prerrenal leve; salino 0.9% con 40 mEq/L KCl','ERC estadio 5; iniciar eritropoyetina SC'],
justificacion:'El gluconato de calcio actúa en 1–3 min y dura 30–60 min, pero no reduce la concentración sérica de K, por lo que debe seguirse inmediatamente de medidas de redistribución y eliminación.',
referencia:'Lameire NH, Levin A, Kellum JA, et al. KDIGO Consensus Conference on AKI/CKD. Kidney Int 2021;100:516-526; Starr MC, et al. Pediatrics 2021.'},

{id:104,tema:'nef',subtema:'HiperK grave: shift intracelular',
escenario:'Tras gluconato de calcio al 10% IV, el QRS se estrecha. Se suspende ibuprofeno y se inicia rehidratación cuidadosa con cristaloide balanceado libre de K.',
pregunta:'¿Cuál es la combinación terapéutica más eficaz para promover el desplazamiento intracelular rápido del K mientras se prepara su eliminación renal o dialítica?',
opciones:['Insulina regular IV (0.1 UI/kg = 1.6 UI) + glucosa IV (0.5 g/kg = 8 g, equivalente a 80 mL de glucosada 10% o 32 mL al 25%) para prevenir hipoglucemia, asociada a β2-agonista inhalado (salbutamol nebulizado 2.5–5 mg), reservando bicarbonato solo si acidosis metabólica grave y preparando terapia de reemplazo renal si persiste anuria e hiperK refractaria','Dexametasona IV + espironolactona oral','Manitol IV 20% como único agente','Propranolol IV lento 0.05 mg/kg','Cloruro de amonio oral para acidificar la orina'],
justificacion:'Insulina y β2-agonistas estimulan sinérgicamente la bomba Na⁺/K⁺-ATPasa del músculo esquelético y hepatocitos, reduciendo el K sérico 0.5–1.2 mEq/L en 15–30 min. La glucosa concomitante es obligatoria en niños para evitar hipoglucemia grave.',
referencia:'Starr MC, Charlton JR, Guillet R, et al. Advances in Neonatal and Pediatric AKI. Pediatrics 2021;148:e2021051220; KDIGO AKI Updates, 2021.'},

{id:105,tema:'nef',subtema:'Seguimiento post-LRA grave',
escenario:'Con expansión cuidadosa de volumen y manejo médico, el paciente restablece diuresis (1.8 mL/kg/h), K desciende a 4.5 y Cr regresa a 0.42 al sexto día, sin requerir diálisis.',
pregunta:'Según KDIGO 2021 y guías pediátricas, ¿qué conducta de vigilancia a mediano/largo plazo es obligatoria tras el alta de una LRA estadio 2–3?',
opciones:['Evaluación clínica y bioquímica estructurada a los 3 meses post-LRA (creatinina/TFGe, relación proteína o albúmina/creatinina urinaria y TA) con vigilancia periódica posterior: los sobrevivientes de LRA estadio 2–3 tienen mayor riesgo de HTA, proteinuria y ERC, además de evitar estrictamente fármacos nefrotóxicos (AINEs, aminoglucósidos)','Alta definitiva sin volver a medir creatinina ni TA','Ibuprofeno habitual para futuros cuadros febriles una vez normalizada la creatinina','Diuréticos de asa diarios durante 2 años','Biopsia renal percutánea protocolaria a los 6 meses en todos los recuperados'],
justificacion:'KDIGO enfatiza el continuo LRA → enfermedad renal aguda (AKD, 7–90 días) → ERC (>90 días), haciendo obligatorio el control formal a los 3 meses tras cualquier LRA grave pediátrica.',
referencia:'Lameire NH, Levin A, Kellum JA, et al. KDIGO Consensus Conference on AKI/CKD. Kidney Int 2021;100:516-526.'},

{id:106,tema:'nef',subtema:'ERC pediátrica por CAKUT: estadificación',
escenario:'Escolar masculino de 7 años 6 meses, 19.2 kg (p5), talla 110 cm (<p3, Z −2.5). Antecedente prenatal de oligohidramnios e hidronefrosis bilateral grave por valvas de uretra posterior resecadas neonatalmente, con displasia renal bilateral. Control semestral: Cr 1.85 estable >1 año, RAC 420 mg/g (A3), Hb 8.8 (normo-normo, ferritina 165, sat 28%), Ca 8.4, P 6.3, PTHi 235 pg/mL, 25-OH-vit D 16 ng/mL, HCO₃ 17.',
pregunta:'Con Schwartz pediátrica (TFGe = 0.413 × talla/creatinina) y KDIGO 2024, ¿cuál es la TFGe, el estadio de ERC y la etiología líder de ERC en pediatría?',
opciones:['TFGe 24.5 mL/min/1.73 m² (estadio G4 A3: disminución grave); causada por anomalías congénitas del riñón y del tracto urinario (CAKUT), principal causa (>45–50%) de ERC pediátrica (a diferencia del adulto, donde predominan diabetes e HTA)','TFGe 62.0 mL/min/1.73 m² (G2); causada por nefropatía diabética','TFGe 11.2 mL/min/1.73 m² (G5); causada por GEFS primaria','TFGe 44.0 mL/min/1.73 m² (G3b); causada por poliquistosis autosómica dominante','TFGe 88.0 mL/min/1.73 m² (G1); función renal normal para su edad'],
justificacion:'Cálculo: TFGe = 0.413 × 110/1.85 = 24.55 mL/min/1.73 m² (rango G4: 15–29). KDIGO 2024 también recomienda las ecuaciones pediátricas CKiD U25 basadas en creatinina y/o cistatina C para mayor precisión.',
referencia:'KDIGO CKD Work Group. KDIGO 2024 Clinical Practice Guideline for the Evaluation and Management of CKD. Kidney Int 2024;105:S117-S314.'},

{id:107,tema:'nef',subtema:'ERC pediátrica: acidosis y ERC-TMO',
escenario:'El escolar de 7 años con ERC G4 A3 por CAKUT iniciará IECA/ARA-II para nefroprotección antiproteinúrica y control estricto de TA (<p50–75 KDIGO 2024/ensayo ESCAPE); además debe corregirse su perfil metabólico (HCO₃ 17, P 6.3, PTHi 235).',
pregunta:'Según KDIGO 2024, ¿cuál es la conducta para la acidosis metabólica crónica y el trastorno mineral-óseo (ERC-TMO) en niños?',
opciones:['Corregir la acidosis con bicarbonato de sodio (o citrato) oral para mantener HCO₃ ≥22 mEq/L (evita catabolismo proteico, desmineralización ósea y resistencia a GH) y tratar el hiperparatiroidismo secundario con restricción dietética moderada de fósforo, quelantes (carbonato de calcio o sevelámero), vitamina D nativa (colecalciferol) y análogos activos (calcitriol)','Restringir el calcio dietético a cero y dar corticoides orales para reducir PTH','Mantener HCO₃ en 16 mEq/L sin suplementos porque protege contra calcificación vascular','Fósforo oral suplementario + furosemida en dosis altas','Paratiroidectomía subtotal inmediata antes de tratamiento médico'],
justificacion:'En niños en crecimiento, el control meticuloso de la acidosis y la ERC-TMO previene las deformidades óseas del raquitismo renal y favorece el crecimiento lineal.',
referencia:'KDIGO CKD Work Group. KDIGO 2024 Clinical Practice Guideline. Kidney Int 2024;105:S117-S314.'},

{id:108,tema:'nef',subtema:'ERC pediátrica: talla baja y anemia',
escenario:'El escolar de 7 años con ERC G4 corrige acidosis (HCO₃ 23), optimiza nutrición calórico-proteica y controla hiperparatiroidismo; a los 6 meses persiste talla −2.6 DE, velocidad 3.4 cm/año y anemia renal sintomática (Hb 8.7 con depósitos de hierro repletos).',
pregunta:'Según KDIGO 2024, ¿cuál es el manejo específico de la talla baja refractaria y la anemia asociada a ERC en este niño?',
opciones:['Iniciar hormona de crecimiento humana recombinante (rhGH) SC (aprobada en ERC G3a–G5 con talla <p3 o velocidad <p25 una vez corregidos nutrición, acidosis y ERC-TMO) e iniciar agente estimulante de eritropoyesis (epoetina alfa o darbepoetina) con meta de Hb 10.0–12.0 g/dL (evitando >12–13 g/dL por riesgo cardiovascular)','Hierro IV en dosis máximas ignorando que ferritina y saturación son normales, y esperar al trasplante renal para talla baja','Transfundir concentrado eritrocitario cada 3 semanas hasta Hb 14.5','Testosterona IM para acelerar cierre epifisario','Dieta estrictamente hipoproteica (<0.4 g/kg/día) para frenar progresión renal'],
justificacion:'El uso oportuno de rhGH permite recuperar potencial de talla adulta antes del cierre epifisario puberal. Evitar transfusiones innecesarias previene sensibilización HLA de cara a trasplante renal anticipado.',
referencia:'KDIGO CKD Work Group. KDIGO 2024 Clinical Practice Guideline. Kidney Int 2024;105:S117-S314.'},

{id:109,tema:'nef',subtema:'Síndrome nefrótico idiopático: diagnóstico y primera línea',
escenario:'Preescolar femenino de 5 años 1 mes, 18 kg habitual (21.2 kg actual, +3.2 kg por edema), talla 109 cm (p50); sana, vacunas completas. 6 días de edema palpebral matutino → anasarca (periorbitario bilateral, ascitis moderada, fóvea +++ en miembros inferiores), orina espumosa y oliguria. TA 94/58, sin hematuria macroscópica. Proteína/creatinina urinaria 7.4 mg/mg (>2.0 nefrótico), albúmina 1.5 g/dL, colesterol 355, triglicéridos 290, C3/C4 normales, ANA negativos, Cr 0.38.',
pregunta:'Con edad típica (1–12 años), ausencia de signos nefríticos y criterios bioquímicos de SN idiopático, ¿cuál es el diagnóstico histopatológico más probable y el tratamiento de primera línea según IPNA 2023/KDIGO 2021?',
opciones:['Síndrome nefrótico idiopático corticosensible (enfermedad de cambios mínimos en >80–85%); tratamiento empírico SIN biopsia renal previa con prednisona VO 60 mg/m²/día o 2 mg/kg/día (36 mg/día calculados sobre peso seco habitual de 18 kg, máx 60 mg/día) × 4–6 semanas, luego 4–6 semanas en días alternos (40 mg/m² o 1.5 mg/kg; total 8–12 semanas)','Nefropatía membranosa; biopsia renal percutánea inmediata antes de fármacos','GEFS corticorresistente; ciclosporina VO como primera línea','Glomerulonefritis postestreptocócica; solo furosemida + dieta sin sal','Amiloidosis renal secundaria; colchicina oral'],
justificacion:'En pediatría, la respuesta clínica a corticoides tiene mayor valor pronóstico que la histología inicial. La biopsia renal se reserva para edad <1 año o >12 años, hipocomplementemia, hematuria macroscópica o corticorresistencia.',
referencia:'Trautmann A, Boyer O, Hodson E, et al. IPNA recommendations for steroid-sensitive nephrotic syndrome. Pediatr Nephrol 2023;38:877-919; KDIGO 2021 Glomerular Diseases.'},

{id:110,tema:'nef',subtema:'SN + LRA por hipovolemia ("underfill")',
escenario:'Al segundo día del ingreso, tras dos dosis altas de furosemida IV para movilizar el edema, la niña de 5 años desarrolla dolor abdominal cólico, taquicardia 146, extremidades frías, llenado 3.5 s, TA 78/46, oliguria (0.2 mL/kg/h) y Cr sube de 0.38 a 1.15 mg/dL (LRA estadio 3) con hemoconcentración.',
pregunta:'¿Cuál es el mecanismo fisiopatológico y el tratamiento de emergencia para restaurar la perfusión renal sin agravar el edema pulmonar?',
opciones:['LRA prerrenal por hipovolemia intravascular grave ("underfill") por presión oncótica críticamente baja (albúmina 1.5) agravada por diuréticos; suspender diuréticos aislados e infundir albúmina humana pobre en sal al 20% a 0.5–1.0 g/kg (9–18 g) IV lento en 2–4 h (expande selectivamente el espacio intravascular) + furosemida IV (1–2 mg/kg) solo al finalizar la albúmina una vez restaurada la estabilidad hemodinámica','Trombosis bilateral de arterias renales; alteplasa IV bolo','Nefritis intersticial aguda por prednisona; suspender inmediatamente los corticoides','Obstrucción urinaria baja; talla suprapúbica de urgencia','Crisis hipertensiva maligna; nitroprusiato IV'],
justificacion:'El uso agresivo de diuréticos en un nefrótico con hipovolemia intravascular precipita choque hipovolémico, LRA isquémica y trombosis venosa renal/cerebral por hemoconcentración.',
referencia:'Trautmann A, et al. IPNA recommendations for steroid-sensitive nephrotic syndrome. Pediatr Nephrol 2023;38:877-919.'},

{id:111,tema:'nef',subtema:'SN: profilaxis infecciosa y vacunación',
escenario:'La paciente de 5 años con SN recupera perfusión renal (Cr 0.36) tras albúmina y entra en remisión completa (proteinuria negativa 3 días consecutivos) al día 10 de prednisona oral.',
pregunta:'Considerando la inmunosupresión humoral (pérdida urinaria de IgG y factores B/D del complemento) y farmacológica, ¿qué medida preventiva infecciosa es fundamental según IPNA 2023 y AAP 2024?',
opciones:['Administrar vacuna antineumocócica conjugada (PCV13/15/20) y PPSV23 más influenza inactivada anual, posponiendo virus vivos atenuados (SRP, varicela) hasta ≥1 mes tras suspender prednisona en dosis altas (≥2 mg/kg/día por ≥14 días), y educar a los padres para acudir de urgencia ante fiebre o dolor abdominal (riesgo de peritonitis bacteriana espontánea por S. pneumoniae o E. coli)','Contraindicar todas las vacunas inactivadas durante los siguientes 5 años','Aplicar SRP y varicela inmediatamente mientras toma prednisona a 2 mg/kg/día','Amoxicilina profiláctica diaria de por vida aunque esté en remisión sin edema','Gammagrafía V/Q cada 3 meses'],
justificacion:'La pérdida urinaria de opsoninas (factor B e IgG) expone a los nefróticos a infecciones invasivas fulminantes por bacterias encapsuladas (S. pneumoniae), haciendo esencial la vacunación antineumocócica completa.',
referencia:'Trautmann A, et al. IPNA recommendations for steroid-sensitive nephrotic syndrome. Pediatr Nephrol 2023;38:877-919; AAP Red Book 2024–2027.'}, {id:29,tema:'ped',subtema:'Crup: tiempo de observación post-adrenalina',
escenario:'Preescolar masculino de 22 meses, 12 kg (p50), talla 85 cm (p50); vacunas completas. Acude a urgencias por 24 h de rinorrea y febrícula 37.8 °C, con tos perruna, disfonía y estridor inspiratorio de 2 h de evolución. Al examen: ansioso, estridor en reposo, tiraje supraesternal e intercostal moderado, buena entrada de aire bilateral. FC 134, FR 36, SatO₂ 95%, T 37.7 °C (Westley 4–5 puntos). Se administró dexametasona 7.2 mg VO + L-adrenalina nebulizada. A los 30 min: tranquilo, sin estridor en reposo (leve al llorar), tiraje disminuido, SatO₂ 97%.',
pregunta:'Considerando la farmacocinética de los fármacos administrados, ¿cuál es el tiempo mínimo de observación en urgencias antes de un egreso domiciliario seguro?',
opciones:['Observar 2 a 4 h tras la nebulización con adrenalina para vigilar el efecto de rebote del edema subglótico, antes de que la dexametasona alcance su efecto antiinflamatorio pleno','Alta inmediata a los 20 minutos tras terminar la nebulización','Hospitalización obligatoria por 72 h con adrenalina nebulizada cada 4 h','Egreso a los 30 minutos con prescripción de adrenalina nebulizada para uso domiciliario','Observación de 24 h con antibiótico profiláctico'],
justificacion:'La adrenalina inicia en 10–30 min y dura ~2 h, mientras que la dexametasona tarda 2–4 h en alcanzar efecto antiinflamatorio pleno. Sin ventana de observación se pierde la recurrencia del edema subglótico cuando cede la vasoconstricción.',
referencia:'Canadian Paediatric Society. Acute management of croup in the emergency department. Paediatr Child Health 2021 (reafirmado 2023).'},

{id:30,tema:'ped',subtema:'Crup: indicaciones al alta',
escenario:'El mismo preescolar de 22 meses permanece estable durante 3.5 h de observación tras dexametasona + adrenalina: sin estridor en reposo, tolera líquidos, SatO₂ 97%, FC 118, FR 28. Se prepara el alta hospitalaria; los padres preguntan qué cuidados seguir en casa y cuándo regresar.',
pregunta:'¿Qué indicaciones domiciliarias y signos de alarma deben explicarse antes del alta?',
opciones:['Hidratación oral, control térmico con paracetamol o ibuprofeno, evitar humo de tabaco, NO antibióticos ni antitusígenos; regresar de inmediato si reaparece estridor en reposo, tiraje costal, cianosis, babeo continuo o somnolencia excesiva','Dexametasona oral cada 8 h por 5 días y vaporizadores de vapor caliente directo frente al rostro','Amoxicilina por 7 días y jarabe con dextrometorfano por las noches','Nebulizaciones con salbutamol cada 6 h en casa por 3 días','Ayuno de líquidos por 12 h para evitar edema laríngeo'],
justificacion:'Una dosis única de dexametasona tiene vida media biológica de 36–72 h, tiempo en que suele resolverse el cuadro viral. No requiere dosis repetidas, antibióticos ni vapor caliente (riesgo de quemaduras). Los signos de alarma permiten identificar la progresión a obstrucción grave.',
referencia:'NICE Clinical Knowledge Summaries: Croup – Management, 2023.'},

{id:31,tema:'neu',subtema:'NAC: duración óptima del antibiótico',
escenario:'Preescolar femenino de 3 años 2 meses, 14.5 kg (p50), talla 95 cm (p50); vacunas completas. NAC no complicada con diagnóstico clínico; se inició amoxicilina VO 90 mg/kg/día cada 12 h (652 mg por toma). A las 48 h: afebril, apetito recuperado, FR 28 rpm. La madre pregunta cuántos días continuar el antibiótico.',
pregunta:'De acuerdo con los ensayos clínicos SAFER y SCOUT-CAP y las guías vigentes, ¿cuál es la duración óptima del tratamiento oral para una NAC pediátrica no complicada con buena respuesta clínica?',
opciones:['5 días de antibiótico: cursos cortos han demostrado no inferioridad clínica con menor impacto en resistencia antimicrobiana y efectos adversos gastrointestinales','14 días obligatorios para erradicar el estado de portador nasofaríngeo','Suspender el antibiótico inmediatamente al cumplir 48 h sin fiebre','21 días consecutivos para evitar recaída','10 días IV seguidos de 10 días orales'],
justificacion:'Los ensayos SAFER (2021) y SCOUT-CAP (2022) demostraron no inferioridad del esquema corto de 5 días frente a 10 días en NAC pediátrica no complicada con buena respuesta, con menor presión selectiva y menos diarrea asociada a antibióticos.',
referencia:'Pernica JM, et al. SAFER RCT. JAMA Pediatr 2021;175:475-482; Williams DJ, et al. SCOUT-CAP RCT. JAMA Pediatr 2022;176:253-261; NICE NG138 (2023).'},

{id:32,tema:'neu',subtema:'NAC complicada: empiema',

/* ============ ESTADO Y GUARDADO ============ */
const K='panel-enarm-v1';
const blank=()=>({sesiones:[],casos:{},leidos:{},resumenes:[],ankis:[]});
let S=blank();
try{const r=localStorage.getItem(K);if(r)S=Object.assign(blank(),JSON.parse(r))}catch(e){}
let dbDoc=null,tk=null;
function save(){
 try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
 if(dbDoc){clearTimeout(tk);tk=setTimeout(()=>dbDoc.set(JSON.parse(JSON.stringify(S))).catch(()=>{}),600)}
}
(async()=>{try{
 const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
 if(!db||!user)return;
 const id=await user.id();dbDoc=db.collection('data/users/'+id).doc('estado');
 const snap=await dbDoc.get();
 if(snap.exists){S=Object.assign(blank(),snap.data());try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}render()}
 else if(S.sesiones.length||S.resumenes.length||S.ankis.length)save();
}catch(e){}})();

/* ============ UTILIDADES ============ */
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mezclar=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const nomTema=id=>(TEMAS.find(t=>t.id===id)||{}).nombre||id;
const byId=id=>BANCO_CASOS.find(c=>c.id==id);
const fecha=t=>new Date(t).toLocaleDateString('es-MX',{day:'numeric',month:'short'});
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
const pesoDif=d=>d==='dificil'?2:d==='intermedio'?1:0;

/* Errores pendientes: último intento fallado. Prioridad por subtema = suma de (3 + dificultad percibida) */
const pendientes=()=>Object.entries(S.casos).filter(([id,c])=>c.pend&&byId(id)).map(([id,c])=>({id:+id,...c}));
function prioridad(){
 const m={};
 pendientes().forEach(c=>{const x=m[c.sub]||(m[c.sub]={sub:c.sub,p:0,n:0,tema:c.tema,ids:[]});x.p+=3+pesoDif(c.dif);x.n++;x.ids.push(c.id)});
 return Object.values(m).sort((a,b)=>(!!S.leidos[a.sub]-!!S.leidos[b.sub])||b.p-a.p);
}
const etiqueta=p=>p>=6?['🔴','Prioritario']:p>=3?['🟠','Repasar']:['🟡','Reforzar'];
const colorP=p=>p>=6?'var(--bad)':p>=3?'var(--amb)':'#C9B13A';

/* ============ NAVEGACIÓN ============ */
const VIEWS=[['inicio','🏠','Inicio'],['sim','🧪','Simuladores'],['errores','❌','Mis errores'],['leer','📖','Qué leer'],['bib','📚','Biblioteca'],['anki','🗂️','Anki']];
let cur='inicio';
function go(v){cur=v;render();scrollTo(0,0)}
function render(){
 const np=pendientes().length;
 $('nav').innerHTML='<div class="brand">Panel ENARM</div>'+VIEWS.map(([id,ic,n])=>`<a class="${id===cur?'on':''}" onclick="go('${id}')" tabindex="0" role="button" onkeydown="if(event.key==='Enter')go('${id}')"><i>${ic}</i>${n}${id==='errores'&&np?`<b>${np}</b>`:''}</a>`).join('');
 const f={inicio:vInicio,sim:vSim,errores:vErrores,leer:vLeer,bib:vBib,anki:vAnki}[cur];
 $('main').innerHTML=f();
 if(cur==='bib')filtrarBib();
}

/* ============ INICIO ============ */
function vInicio(){
 const R=Object.values(S.casos),resp=R.reduce((a,c)=>a+c.ok+c.mal,0),ok=R.reduce((a,c)=>a+c.ok,0);
 const pr=prioridad(),ult=S.sesiones.slice(-8);
 let h=`<h1>Hola, Barzilai</h1><p class="sub">Tu espacio de estudio para el ENARM.</p>
 <div class="card"><div class="stats"><div><b>${resp?Math.round(ok/resp*100)+'%':'—'}</b>aciertos en total</div><div><b>${resp}</b>respuestas</div><div><b>${pendientes().length}</b>errores por repasar</div><div><b>${S.sesiones.length}</b>sesiones</div></div></div>
 <h2>Qué leer ahora</h2>`;
 if(!pr.length)h+=`<div class="card empty">Aún no hay errores guardados. Haz una simulación y aquí aparecerán los temas que debes leer.<br><br><button class="btn" onclick="go('sim')">Ir a simuladores</button></div>`;
 else{h+='<div class="card">'+pr.slice(0,6).map(x=>`<div class="hm"><span>${esc(x.sub)}${S.leidos[x.sub]?' <span class="mut">(leído)</span>':''}</span><span class="tr"><i style="width:${Math.min(100,x.p*9)}%;background:${colorP(x.p)}"></i></span><span class="mut ui" style="min-width:24px;text-align:right">${x.n}</span></div>`).join('')+`<button class="ghost sm" onclick="go('leer')">Ver plan completo</button></div>`}
 if(ult.length)h+=`<h2>Tus últimas sesiones</h2><div class="card"><div class="chart">${ult.map(s=>`<div style="height:${Math.max(4,s.pct)}%" title="${fecha(s.t)}: ${s.ok}/${s.n}"><small>${s.pct}</small></div>`).join('')}</div><div class="mut ui" style="font-size:13px;margin-top:6px">Porcentaje de aciertos por sesión, de la más antigua a la más reciente</div></div>`;
 h+=`<h2>Accesos</h2><div class="grid"><div class="card"><b class="ui">Simulador de Pediatría</b><p class="mut">${BANCO_CASOS.length} casos clínicos</p><button class="btn" onclick="go('sim')">Practicar</button></div><div class="card"><b class="ui">Biblioteca</b><p class="mut">${S.resumenes.length} resúmenes guardados</p><button class="ghost" onclick="go('bib')">Abrir</button></div><div class="card"><b class="ui">Tarjetas Anki</b><p class="mut">${S.ankis.length} tarjetas</p><button class="ghost" onclick="go('anki')">Abrir</button></div></div>`;
 return h;
}

/* ============ SIMULADOR ============ */
let sim={fase:'lista'},cfg={tema:'',n:0};
function vSim(){
 if(sim.fase==='lista')return `<h1>Simuladores</h1><p class="sub">Elige uno para comenzar. Tus errores se guardan solos.</p>
 <div class="grid"><div class="card"><b class="ui" style="font-size:19px">Pediatría</b><p class="mut">${BANCO_CASOS.length} casos · retroalimentación inmediata</p><button class="btn" onclick="sim.fase='cfg';render()">Configurar sesión</button></div>
 <div class="card mut"><b class="ui" style="font-size:19px">Más especialidades</b><p>Cuando tengas otro simulador, se agrega aquí como una tarjeta nueva.</p></div></div>`;
 if(sim.fase==='cfg'){
  const np=pendientes().length,d=cfg.tema==='errores'?np:cfg.tema?poolDe(cfg.tema).length:0;
  return `<h1>Configura tu sesión</h1><p class="sub">Pediatría</p>
  <label>Tema</label><select onchange="cfg.tema=this.value;render()"><option value="" disabled ${cfg.tema?'':'selected'}>Elige un tema</option>
  <option value="errores" ${cfg.tema==='errores'?'selected':''} ${np?'':'disabled'}>🔁 Repasar solo mis errores (${np})</option>
  ${TEMAS.map(t=>`<option value="${t.id}" ${t.activo?'':'disabled'} ${cfg.tema===t.id?'selected':''}>${esc(t.nombre)}${t.activo?' — '+poolDe(t.id).length+' casos':' (próximamente)'}</option>`).join('')}</select>
  <label>Cantidad de casos</label><div class="pills">${[3,5,10,9999].map(n=>`<button class="pill ${cfg.n===n?'sel':''}" onclick="cfg.n=${n};render()">${n===9999?'Todos':n}</button>`).join('')}</div>
  <p class="mut" style="font-size:14px">${cfg.tema?`Disponibles: ${d}.`:''}</p>
  <div class="row"><button class="btn" ${cfg.tema&&cfg.n&&d?'':'disabled'} onclick="iniciar()">Iniciar simulación</button><button class="ghost" onclick="sim.fase='lista';render()">Volver</button></div>`;
 }
 if(sim.fase==='play')return playHTML();
 return resHTML();
}
const poolDe=t=>t==='errores'?pendientes().map(c=>byId(c.id)):BANCO_CASOS.filter(c=>t==='todos'||c.tema===t);
function iniciar(){
 const casos=mezclar(poolDe(cfg.tema)).slice(0,cfg.n);
 sim={fase:'play',casos,i:0,resp:[],opts:null,ans:null,dif:null,tema:cfg.tema};nuevoCaso();render();scrollTo(0,0);
}
function nuevoCaso(){const c=sim.casos[sim.i];sim.opts=mezclar(c.opciones.map((t,k)=>({t,ok:k===0})));sim.ans=null;sim.dif=null}
function playHTML(){
 const c=sim.casos[sim.i],N=sim.casos.length,L='ABCDE',ci=sim.opts.findIndex(o=>o.ok),a=sim.ans;
 let h=`<div class="row sp"><b class="ui">Caso ${sim.i+1} de ${N}</b><button class="ghost sm" style="border-color:var(--bad);color:var(--bad)" onclick="terminar()">Terminar simulación</button></div><div class="bar"><i style="width:${(sim.i+1)/N*100}%"></i></div>
 <div class="card"><span class="tag">${esc(nomTema(c.tema))} · ${esc(c.subtema)}</span><div class="esc">${esc(c.escenario)}</div><div class="q">${esc(c.pregunta)}</div>
 ${sim.opts.map((o,k)=>`<button class="opt ${a!==null?(k===a?(o.ok?'ok':'bad'):(k===ci?'rev':'')):''}" ${a!==null?'disabled':''} onclick="responder(${k})"><b>${L[k]}</b><span>${esc(o.t)}</span></button>`).join('')}`;
 if(a!==null){const ok=sim.opts[a].ok;h+=`<div class="fb"><b class="ui" style="color:${ok?'var(--ok)':'var(--bad)'};font-size:18px">${ok?'✅ Correcto':'❌ Incorrecto'}</b><p>${ok?'':'La correcta es la <b>'+L[ci]+'</b>. '}${esc(c.justificacion)}</p><small class="mut">Referencia: ${esc(c.referencia)}</small></div>
 <div style="margin-top:16px"><b class="ui">¿Qué tan difícil te resultó?</b><div class="dg">${['facil','intermedio','dificil'].map(d=>`<button class="${d} ${sim.dif===d?'sel':''}" onclick="dificultad('${d}')">${{facil:'Fácil',intermedio:'Intermedio',dificil:'Difícil'}[d]}</button>`).join('')}</div></div>`}
 h+=`</div><div style="text-align:right"><button class="btn" ${a!==null&&sim.dif?'':'disabled'} onclick="siguiente()">${sim.i===N-1?'Ver resultados':'Siguiente caso'}</button></div>`;
 return h;
}
function responder(k){
 if(sim.ans!==null)return;sim.ans=k;
 const c=sim.casos[sim.i],ci=sim.opts.findIndex(o=>o.ok),ok=sim.opts[k].ok,L='ABCDE';
 sim.resp.push({id:c.id,sub:c.subtema,tema:c.tema,pregunta:c.pregunta,ok,dif:null,elegida:L[k]+') '+sim.opts[k].t,correcta:L[ci]+') '+sim.opts[ci].t});
 const r=S.casos[c.id]||(S.casos[c.id]={sub:c.subtema,tema:c.tema,ok:0,mal:0,pend:false});
 ok?r.ok++:r.mal++;r.pend=!ok;r.t=Date.now();if(!ok)r.ult=sim.opts[k].t;
 save();render();
}
function dificultad(d){
 sim.dif=d;const r=sim.resp[sim.resp.length-1];r.dif=d;
 S.casos[r.id].dif=d;save();render();
}
function siguiente(){if(sim.i>=sim.casos.length-1)return terminar();sim.i++;nuevoCaso();render();scrollTo(0,0)}
function terminar(){
 const r=sim.resp;
 if(r.length){const ok=r.filter(x=>x.ok).length;S.sesiones.push({t:Date.now(),tema:sim.tema,n:sim.casos.length,ok,pct:Math.round(ok/sim.casos.length*100)});S.sesiones=S.sesiones.slice(-60);save()}
 sim.fase='res';render();scrollTo(0,0);
}
function resHTML(){
 const r=sim.resp,N=sim.casos.length,ok=r.filter(x=>x.ok).length,pct=r.length?Math.round(ok/N*100):0,mal=r.filter(x=>!x.ok),sin=N-r.length;
 const m={};r.forEach(x=>{m[x.sub]=(m[x.sub]||0)+(x.ok?0:3)+pesoDif(x.dif)});
 const rk=Object.entries(m).sort((a,b)=>b[1]-a[1]);
 return `<h1>Resultados</h1><div class="card"><div class="stats"><div><b>${pct}%</b>aciertos</div><div><b>${ok} de ${N}</b>correctos</div>${sin?`<div><b>${sin}</b>sin responder</div>`:''}</div>
 <p class="mut" style="margin:8px 0 0">${r.length?'✔ Guardado: tus errores quedaron registrados en “Mis errores” y “Qué leer”.':'No respondiste casos, no se guardó nada.'}</p></div>
 ${mal.length?`<h2>Casos que fallaste</h2>${mal.map(x=>`<div class="item"><b class="ui">${esc(x.sub)}</b><br>${esc(x.pregunta)}<br><span class="mut">Tu respuesta:</span> ${esc(x.elegida)}<br><span class="mut">Correcta:</span> ${esc(x.correcta)}</div>`).join('')}`:''}
 <h2>Qué estudiar de esta sesión</h2>${rk.length&&rk.some(x=>x[1])?`<div class="card">${rk.filter(x=>x[1]).map(([s,p])=>{const e=etiqueta(p);return `<div class="hm"><span>${esc(s)}</span><span class="tr"><i style="width:${Math.min(100,p*14)}%;background:${colorP(p)}"></i></span><span class="ui" style="font-size:13px;min-width:92px">${e[0]} ${e[1]}</span></div>`}).join('')}</div>`:'<div class="card">Sin temas por reforzar en esta sesión.</div>'}
 <div class="row" style="margin:22px 0"><button class="btn" onclick="sim={fase:'cfg'};render()">Otra simulación</button><button class="ghost" onclick="go('leer')">Ver qué leer</button><button class="ghost" onclick="sim={fase:'lista'};go('inicio')">Inicio</button></div>`;
}

/* ============ MIS ERRORES ============ */
function vErrores(){
 const p=pendientes().sort((a,b)=>b.mal-a.mal||b.t-a.t);
 let h=`<h1>Mis errores</h1><p class="sub">Casos cuyo último intento fue incorrecto. Si los aciertas después, salen de esta lista.</p>`;
 if(!p.length)return h+`<div class="card empty">No tienes errores pendientes. 🎉</div>`;
 h+=`<button class="btn" onclick="cfg={tema:'errores',n:9999};iniciar();cur='sim';render()">Repasar todos (${p.length})</button>`;
 return h+p.map(e=>{const c=byId(e.id);return `<div class="item"><div class="row sp"><span class="tag">${esc(e.sub)}</span><span class="mut ui" style="font-size:13px">${e.mal} fallo${e.mal>1?'s':''} · ${fecha(e.t)}</span></div>
 <p style="margin:8px 0"><b>${esc(c.pregunta)}</b></p>
 <details><summary>Ver caso, respuesta y justificación</summary><p>${esc(c.escenario)}</p>${e.ult?`<p><span class="mut">Tu respuesta:</span> ${esc(e.ult)}</p>`:''}<p><span class="mut">Correcta:</span> ${esc(c.opciones[0])}</p><p>${esc(c.justificacion)}</p><small class="mut">${esc(c.referencia)}</small></details>
 <div style="margin-top:8px"><button class="ghost sm" onclick="ankiDeError(${e.id})">Crear tarjeta Anki</button></div></div>`}).join('');
}

/* ============ QUÉ LEER ============ */
function vLeer(){
 const pr=prioridad();
 let h=`<h1>Qué leer</h1><p class="sub">Temas ordenados según tus errores pendientes y la dificultad que marcaste.</p>`;
 if(!pr.length)return h+`<div class="card empty">Todavía no hay temas por reforzar. Cuando falles casos en un simulador aparecerán aquí.</div>`;
 return h+pr.map(x=>{const e=etiqueta(x.p),rd=S.leidos[x.sub];return `<div class="card"><div class="row sp"><b class="ui" style="font-size:18px">${esc(x.sub)}</b><span class="ui" style="font-weight:700">${e[0]} ${e[1]}</span></div>
 <p class="mut" style="margin:4px 0 10px">${esc(nomTema(x.tema))} · ${x.n} caso${x.n>1?'s':''} pendiente${x.n>1?'s':''}${rd?` · leído el ${fecha(rd)}`:''}</p>
 <div class="row"><button class="ghost sm" onclick="marcarLeido('${esc(x.sub).replace(/'/g,"\\'")}')">${rd?'Volver a marcar':'Ya lo leí'}</button><button class="btn sm" onclick="repasarSub('${esc(x.sub).replace(/'/g,"\\'")}')">Reevaluar este tema</button><button class="ghost sm" onclick="bibDe('${esc(x.sub).replace(/'/g,"\\'")}')">Buscar en biblioteca</button></div></div>`}).join('');
}
function marcarLeido(s){S.leidos[s]=Date.now();save();render()}
function repasarSub(s){
 const casos=pendientes().filter(c=>c.sub===s).map(c=>byId(c.id));
 sim={fase:'play',casos:mezclar(casos),i:0,resp:[],tema:'errores'};nuevoCaso();cur='sim';render();scrollTo(0,0);
}
function bibDe(s){bibQ=s;go('bib')}

/* ============ BIBLIOTECA ============ */
let bibQ='';
function vBib(){
 return `<h1>Biblioteca de resúmenes</h1><p class="sub">Guarda aquí tus apuntes, enlaces a documentos o resúmenes propios.</p>
 <details class="card"><summary>➕ Agregar resumen</summary>
 <label for="bT">Título</label><input id="bT" placeholder="Ej. Intoxicación por organofosforados">
 <label for="bS">Tema o subtema</label><input id="bS" placeholder="Ej. Toxicología">
 <label for="bL">Enlace (Drive, Notion, etc.), opcional</label><input id="bL" placeholder="https://...">
 <label for="bN">Notas o resumen</label><textarea id="bN" placeholder="Puntos clave, perlas clínicas..."></textarea>
 <p><button class="btn" onclick="addBib()">Guardar resumen</button></p></details>
 <input id="bQ" placeholder="Buscar por título, tema o texto…" value="${esc(bibQ)}" oninput="bibQ=this.value;filtrarBib()" aria-label="Buscar">
 <div id="bList"></div>`;
}
function addBib(){
 const t=$('bT').value.trim();if(!t)return toast('Escribe un título');
 const l=$('bL').value.trim();
 S.resumenes.unshift({id:Date.now(),t,s:$('bS').value.trim(),l:/^https?:\/\//i.test(l)?l:'',n:$('bN').value.trim(),f:Date.now()});
 save();toast('Resumen guardado');render();
}
function filtrarBib(){
 const q=bibQ.toLowerCase(),L=S.resumenes.filter(r=>!q||(r.t+' '+r.s+' '+r.n).toLowerCase().includes(q));
 $('bList').innerHTML=L.length?L.map(r=>`<div class="card"><div class="row sp"><b class="ui" style="font-size:17px">${esc(r.t)}</b>${r.s?`<span class="tag">${esc(r.s)}</span>`:''}</div>
 ${r.n?`<p style="white-space:pre-wrap">${esc(r.n)}</p>`:''}<div class="row">${r.l?`<a class="ghost sm" style="text-decoration:none;color:var(--teal)" href="${esc(r.l)}" target="_blank" rel="noopener">Abrir enlace</a>`:''}<button class="ghost sm" onclick="delBib(${r.id})">Eliminar</button><span class="mut ui" style="font-size:12px">${fecha(r.f)}</span></div></div>`).join(''):`<div class="empty">${S.resumenes.length?'Sin resultados para tu búsqueda.':'Tu biblioteca está vacía. Agrega tu primer resumen arriba.'}</div>`;
}
function delBib(id){if(!confirm('¿Eliminar este resumen?'))return;S.resumenes=S.resumenes.filter(r=>r.id!==id);save();render()}

/* ============ ANKI ============ */
let rev=null;
function vAnki(){
 if(rev&&rev.fase){const c=rev.l[rev.i];
  return `<h1>Repaso de tarjetas</h1><div class="bar"><i style="width:${(rev.i+1)/rev.l.length*100}%"></i></div><p class="mut ui">Tarjeta ${rev.i+1} de ${rev.l.length}</p>
  <div class="card flip" onclick="rev.v=!rev.v;render()" style="white-space:pre-wrap">${esc(rev.v?c.b:c.f)}</div><p class="mut" style="text-align:center">Toca la tarjeta para ${rev.v?'volver a la pregunta':'ver la respuesta'}</p>
  <div class="row" style="justify-content:center"><button class="ghost" onclick="rev.i>0&&(rev.i--,rev.v=false);render()">Anterior</button><button class="btn" onclick="revSig()">${rev.i===rev.l.length-1?'Terminar':'Siguiente'}</button></div>`}
 return `<h1>Tarjetas Anki</h1><p class="sub">Crea tarjetas y expórtalas a Anki. También puedes crearlas desde “Mis errores”.</p>
 <details class="card" id="aForm"><summary>➕ Nueva tarjeta</summary>
 <label for="aF">Frente (pregunta)</label><textarea id="aF"></textarea><label for="aB">Reverso (respuesta)</label><textarea id="aB"></textarea>
 <label for="aT">Etiqueta</label><input id="aT" placeholder="Ej. pediatria"><p><button class="btn" onclick="addAnki()">Guardar tarjeta</button></p></details>
 <div class="row" style="margin:10px 0"><button class="btn" ${S.ankis.length?'':'disabled'} onclick="rev={fase:1,l:mezclar(S.ankis),i:0,v:false};render()">Repasar (${S.ankis.length})</button><button class="ghost" ${S.ankis.length?'':'disabled'} onclick="exportAnki()">Exportar CSV para Anki</button></div>
 ${S.ankis.length?S.ankis.map(a=>`<div class="card"><div class="row sp"><span class="tag">${esc(a.t||'sin etiqueta')}</span><button class="ghost sm" onclick="delAnki(${a.id})">Eliminar</button></div><p><b>${esc(a.f)}</b></p><p class="mut" style="white-space:pre-wrap;margin:0">${esc(a.b)}</p></div>`).join(''):'<div class="empty">Aún no tienes tarjetas.</div>'}`;
}
function revSig(){if(rev.i>=rev.l.length-1){rev=null}else{rev.i++;rev.v=false}render()}
function addAnki(){
 const f=$('aF').value.trim(),b=$('aB').value.trim();if(!f||!b)return toast('Llena frente y reverso');
 S.ankis.unshift({id:Date.now(),f,b,t:$('aT').value.trim()});save();toast('Tarjeta guardada');render();
}
function ankiDeError(id){
 const c=byId(id);if(S.ankis.some(a=>a.cid===id))return toast('Ya existe una tarjeta de este caso');
 S.ankis.unshift({id:Date.now(),cid:id,f:c.pregunta+'\n\n'+c.escenario,b:c.opciones[0]+'\n\n'+c.justificacion,t:'pediatria '+c.subtema.replace(/\s+/g,'_')});
 save();toast('Tarjeta creada en Anki');render();
}
function delAnki(id){S.ankis=S.ankis.filter(a=>a.id!==id);save();render()}
async function exportAnki(){
 const q=x=>'"'+String(x).replace(/"/g,'""').replace(/\n/g,'<br>')+'"';
 const csv='\ufeff'+S.ankis.map(a=>[q(a.f),q(a.b),q(a.t||'')].join(',')).join('\n');
 try{const d=await claude.use('downloads');if(!d)throw 0;await d.save({filename:'tarjetas-anki.csv',data:csv});toast('Archivo listo')}
 catch(e){try{await navigator.clipboard.writeText(csv);toast('Copiado: pégalo en un archivo .csv')}catch(_){toast('No se pudo exportar aquí')}}
}

render();
</script>
</body></html>
